services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    environment:
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "300"
      VITE_API_BASE_URL: http://localhost:${BACKEND_PORT:-8080}
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    environment:
      GRADLE_USER_HOME: /gradle-cache
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-career_compass}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-career}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-career_dev_password}
      APP_CORS_ALLOWED_ORIGIN: http://localhost:${FRONTEND_PORT:-5173}
      APP_BACKEND_BASE_URL: http://localhost:${BACKEND_PORT:-8080}
      JWT_SECRET: ${JWT_SECRET:-career-compass-local-development-secret-key-change-me}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    volumes:
      - ./backend:/workspace
      - backend-gradle-cache:/gradle-cache
      - backend-project-cache:/workspace/.gradle
    depends_on:
      db:
        condition: service_healthy

  db:
    image: pgvector/pgvector:0.8.6-pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-career_compass}
      POSTGRES_USER: ${POSTGRES_USER:-career}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-career_dev_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  frontend-node-modules:
  backend-gradle-cache:
  backend-project-cache:
  postgres-data:
