spring:
  application:
    name: career-compass-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/career_compass}
    username: ${SPRING_DATASOURCE_USERNAME:career}
    password: ${SPRING_DATASOURCE_PASSWORD:career_dev_password}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  devtools:
    restart:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

openai:
  api-key: ${OPENAI_API_KEY:}

app:
  backend-base-url: ${APP_BACKEND_BASE_URL:http://localhost:8080}
  cors:
    allowed-origin: ${APP_CORS_ALLOWED_ORIGIN:http://localhost:5173}
  jwt:
    issuer: career-compass
    secret: ${JWT_SECRET:career-compass-local-development-secret-key-change-me}
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:3600}
